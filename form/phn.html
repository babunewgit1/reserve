<script>
   document.addEventListener("DOMContentLoaded", function () {
      const categoryMap = {
         light_jets: "Light Jet",
         midsize_jets: "Midsize Jet",
         super_midsize_jets: "Super Midsize Jet",
         heavy_jets: "Heavy Jet",
         turboprops_jets: "Turbo Prop",
      };

      // ── HELPER: find and click the matching filter label ───────────────────
      function triggerFilter(categoryName) {
         const labels = document.querySelectorAll(".pjr_filter_cl_rdo_text");
         const target = [...labels].find(
            (label) => label.textContent.trim() === categoryName,
         );

         if (target) {
            const labelEl = target.closest("label");
            labelEl.click();

            const radio = labelEl.querySelector('input[type="radio"]');
            if (radio) {
               radio.checked = true;
               radio.dispatchEvent(new Event("change", { bubbles: true }));
               radio.dispatchEvent(new Event("input", { bubbles: true }));
            }

            target.scrollIntoView({
               behavior: "smooth",
               inline: "center",
               block: "nearest",
            });

            return true;
         }
         return false;
      }

      // ── ATTACH LISTENERS TO BOTH DESKTOP + MOBILE MENU ITEMS ──────────────
      Object.keys(categoryMap).forEach(function (id) {
         // querySelectorAll catches duplicated IDs (desktop + mobile same ID)
         const menuItems = document.querySelectorAll("#" + id);
         if (!menuItems.length) return;

         menuItems.forEach(function (menuItem) {
            menuItem.addEventListener("click", function (e) {
               const categoryName = categoryMap[id];

               // Always store (for cross-page navigation case)
               sessionStorage.setItem("selectedJetCategory", categoryName);
               sessionStorage.setItem("selectedJetMenuId", id);

               // If already on /private-jets, handle directly without reload
               if (window.location.pathname === "/private-jets") {
                  e.preventDefault();

                  // Scroll to filter section smoothly
                  const filterEl = document.querySelector(
                     ".pjr_filter_cl_wrapper",
                  );
                  if (filterEl) {
                     filterEl.scrollIntoView({
                        behavior: "smooth",
                        block: "start",
                     });
                  }

                  // Try immediately, retry if Swiper not ready yet
                  if (!triggerFilter(categoryName)) {
                     let attempts = 0;
                     const interval = setInterval(function () {
                        attempts++;
                        if (triggerFilter(categoryName) || attempts > 20) {
                           clearInterval(interval);
                        }
                     }, 300);
                  }
               }
               // else: let normal navigation happen, sessionStorage will restore it
            });
         });
      });

      // ── RESTORE FROM sessionStorage (arriving from another page) ──────────
      const savedCategory = sessionStorage.getItem("selectedJetCategory");
      const savedMenuId = sessionStorage.getItem("selectedJetMenuId");

      if (savedCategory && window.location.pathname === "/private-jets") {
         sessionStorage.removeItem("selectedJetCategory");
         sessionStorage.removeItem("selectedJetMenuId");

         // Highlight active megamenu item
         if (savedMenuId) {
            document.querySelectorAll("#" + savedMenuId).forEach(function (el) {
               el.style.color = "rgb(255, 93, 71)";
               el.style.backgroundColor = "rgb(255, 255, 255)";
            });
         }

         let attempts = 0;
         const interval = setInterval(function () {
            attempts++;
            if (triggerFilter(savedCategory) || attempts > 30) {
               clearInterval(interval);
            }
         }, 300);
      }
   });
</script>
<!-- mega menu private jet selection code end -->
